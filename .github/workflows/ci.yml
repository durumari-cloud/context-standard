name: conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r conformance/requirements.txt
      - name: Templates match their source
        run: python templates/generate.py --check
      - name: Conformance suite
        run: python -m pytest -q conformance
      - name: Check the examples with the command-line checker
        run: python conformance/checks.py examples/documents/*.json examples/work-logs/*.json examples/document-types/*.json

  commit-emails:
    name: commit emails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Only GitHub noreply or bot addresses
        # A public repository publishes every author and committer address. Personal
        # addresses are refused; the log names offending commits, never the address.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          range="$HEAD"
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then range="$BASE..$HEAD"; fi
          bad=$(git log --format='%h %ae %ce' "$range" | awk '{ for (i = 2; i <= 3; i++) if ($i !~ /@users\.noreply\.github\.com$/ && $i != "noreply@github.com") { print $1; break } }')
          if [ -n "$bad" ]; then
            echo "::error::Use a GitHub noreply address (Settings > Emails). Commits: $(echo $bad | tr '\n' ' ')"
            exit 1
          fi
